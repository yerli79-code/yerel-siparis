name: Production Backup Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Execute Production Backup From Release
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/order-management-20260630

      - name: Report checked out release
        run: |
          git rev-parse HEAD
          git status --short

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Install PostgreSQL Client
        run: |
          PG_CLIENT_POLICY=$(apt-cache policy postgresql-client-17)
          echo "$PG_CLIENT_POLICY"

          if ! echo "$PG_CLIENT_POLICY" | grep -Eq 'Candidate: [0-9]'; then
            echo "PostgreSQL 17 client package is unavailable." >&2
            exit 1
          fi

          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

          PG_DUMP_VERSION=$(/usr/lib/postgresql/17/bin/pg_dump --version)
          echo "$PG_DUMP_VERSION"

          if ! echo "$PG_DUMP_VERSION" | grep -Eq 'PostgreSQL\) 17\.'; then
            echo "Expected PostgreSQL 17 pg_dump." >&2
            exit 1
          fi

      - name: Run Backup Pipeline
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_BACKUP_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SECRET_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_DRY_RUN: 'false'
        run: |
          umask 077
          node scripts/backup/run-backup.ts
