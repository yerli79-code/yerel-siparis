name: PR CI

on:
  pull_request:
    branches:
      - main
      - release/order-management-20260630
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Generate Next.js route types without building
        run: ./node_modules/.bin/next typegen

      - name: Check TypeScript
        run: ./node_modules/.bin/tsc --noEmit --incremental false
